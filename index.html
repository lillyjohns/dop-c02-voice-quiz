<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Certified DevOps Engineer - Professional (DOP-C02) &mdash; Highlight-Only Concept Check</title>
<style>
:root {
  --bg: #121420; --card: #1e212c; --text: #ebedf2; --mute: #8c919e;
  --green: #34c759; --red: #b2423c; --accent: #ffbe3c; --border: #2a2e3c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0; padding: 0;
}
mark { background: rgba(255,190,60,0.32); color: #ffdb8a; border-radius: 3px; padding: 0 2px; font-weight: 700; }
.topbar {
  background: #181a24; padding: 14px 20px; display: flex; justify-content: space-between;
  align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
  flex-wrap: wrap; row-gap: 8px;
}
.topbar .title { color: var(--accent); font-weight: 700; font-size: 15px; flex-basis: 100%; order: -1; }
.topbar .count { color: var(--mute); font-size: 14px; order: 1; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 80px; }
.stem { font-size: 16px; line-height: 1.7; margin: 0 0 24px; white-space: pre-wrap; font-family: inherit; }
.choice {
  display: block; padding: 14px 16px; margin-bottom: 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  cursor: pointer; line-height: 1.6;
}
.choice .letter { font-weight: 700; color: var(--mute); margin-right: 8px; }
.choice.correct { background: rgba(52,199,89,0.14); border-color: var(--green); }
.choice.correct .letter { color: var(--green); }
.choice.wrong { background: rgba(178,66,60,0.18); border-color: var(--red); opacity: 0.85; }
.choice.dim { opacity: 0.45; }
.badge {
  display: inline-block; font-weight: 700; padding: 5px 14px; border-radius: 20px; font-size: 14px;
  margin-bottom: 16px; display: none;
}
.badge.correct { background: var(--green); color: #0d1f12; }
.badge.wrong { background: var(--red); color: #fff; }
.badge.show { display: inline-block; }
.hint { color: var(--mute); font-size: 13px; margin-bottom: 14px; }
.navbtn {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 10px 20px; font-size: 16px; font-weight: 700; cursor: pointer;
}
</style>
</head>
<body>
<div class="topbar">
  <div class="title">AWS Certified DevOps Engineer - Professional (DOP-C02) &mdash; read ONLY the highlighted words</div>
  <div class="count" id="qCount"></div>
</div>
<div class="wrap">
  <div class="hint">Concept check: try covering everything except the highlighted words. You should still be able to pick the right answer.</div>
  <div class="stem" id="stemText"></div>
  <div id="badge" class="badge"></div>
  <div id="choicesWrap"></div>
  <div style="display:flex; gap:10px; margin-top:20px;">
    <span class="navbtn" onclick="prevQ()">&larr; Prev</span>
    <span class="navbtn" onclick="nextQ()">Next &rarr;</span>
  </div>
</div>
<script>
const QUESTIONS = [{"num": 1, "stemHtml": "A company has a mobile application that makes HTTP API calls to an Application Load Balancer (ALB). The ALB routes requests to an AWS Lambda function. Many different versions of the application are in use at any given time, including versions that are in testing by a subset of users. The version of the application is defined in the user-agent header that is sent with all requests to the API. After a series of recent changes to the API, the company has observed issues with the application. The company needs to <mark>gather a metric for each API operation by response code for each version</mark> of the application that is in use. A DevOps engineer has modified the Lambda function to extract the API operation name, version information from the user-agent header and response code. Which additional set of actions should the DevOps engineer take to gather the required metrics?", "choices": [{"letter": "A", "html": "Modify the Lambda function to <mark>write the API operation name, response code, and version number as a log line</mark> to an Amazon CloudWatch Logs log group. Configure a <mark>CloudWatch Logs metric filter that increments a metric for each API operation name</mark>. Specify <mark>response code and application version as dimensions</mark> for the metric."}, {"letter": "B", "html": "Modify the Lambda function to write the API operation name, response code, and version number as a log line to an Amazon CloudWatch Logs log group. Configure a <mark>CloudWatch Logs Insights query to populate CloudWatch metrics</mark> from the log lines. Specify response code and application version as dimensions for the metric."}, {"letter": "C", "html": "Configure the <mark>ALB access logs</mark> to write to an Amazon CloudWatch Logs log group. Modify the <mark>Lambda function to respond to the ALB with</mark> the API operation name, response code, and version number as <mark>response metadata</mark>. Configure a CloudWatch Logs metric filter that increments a metric for each API operation name. Specify response code and application version as dimensions for the metric."}, {"letter": "D", "html": "Configure <mark>AWS X-Ray</mark> integration on the Lambda function. Modify the Lambda function to create an <mark>X-Ray subsegment</mark> with the API operation name, response code, and version number. Configure <mark>X-Ray insights</mark> to extract an aggregated metric for each API operation name and to publish the metric to Amazon CloudWatch. Specify response code and application version as dimensions for the metric."}], "correct": ["A"]}, {"num": 2, "stemHtml": "A company provides an application to customers. The application has an Amazon API Gateway REST API that invokes an AWS Lambda function. On initialization, the Lambda function loads a large amount of data from an Amazon DynamoDB table. The data load process results in long cold-start times of 8-10 seconds. The DynamoDB table has DynamoDB Accelerator (DAX) configured. Customers report that the application intermittently takes a long time to respond to requests. The application receives thousands of requests throughout the day. In the middle of the day, the application experiences <mark>10 times more requests</mark> than at any other time of the day. Near the end of the day, the application&#x27;s request volume <mark>decreases to 10%</mark> of its normal total. A DevOps engineer needs to <mark>reduce the latency of the Lambda function at all times of the day</mark>. Which solution will meet these requirements?", "choices": [{"letter": "A", "html": "Configure provisioned concurrency on the Lambda function with a <mark>concurrency value of 1</mark>. <mark>Delete the DAX cluster</mark> for the DynamoDB table."}, {"letter": "B", "html": "Configure <mark>reserved concurrency</mark> on the Lambda function with a concurrency <mark>value of 0</mark>."}, {"letter": "C", "html": "Configure <mark>provisioned concurrency</mark> on the Lambda function. Configure AWS <mark>Application Auto Scaling</mark> on the Lambda function with provisioned concurrency values set to a <mark>minimum of 1 and a maximum of 100</mark>."}, {"letter": "D", "html": "Configure <mark>reserved concurrency</mark> on the Lambda function. Configure AWS Application <mark>Auto Scaling on the API Gateway API</mark> with a reserved concurrency maximum value of 100."}], "correct": ["C"]}, {"num": 3, "stemHtml": "A company is adopting AWS CodeDeploy to automate its application deployments for a Java-Apache Tomcat application with an Apache Webserver. The development team started with a proof of concept, created a deployment group for a developer environment, and performed functional tests within the application. After completion, the team will create additional deployment groups for staging and production. The current log level is configured within the Apache settings, but the team wants to <mark>change this configuration dynamically when the deployment occurs</mark>, so that they can set <mark>different log level configurations depending on the deployment group</mark> without having a different application revision for each group. How can these requirements be met with the <mark>LEAST management overhead</mark> and <mark>without requiring different script versions</mark> for each deployment group?", "choices": [{"letter": "A", "html": "<mark>Tag the Amazon EC2 instances</mark> depending on the deployment group. Then place a script into the application revision that <mark>calls the metadata service and the EC2 API</mark> to identify which deployment group the instance is part of. Use this information to configure the log level settings. Reference the script as part of the AfterInstall lifecycle hook in the appspec.yml file."}, {"letter": "B", "html": "Create a script that uses the CodeDeploy environment variable DEPLOYMENT_GROUP_ NAME to identify which deployment group the instance is part of. Use this information to configure the log level settings. Reference this script as part of the <mark>BeforeInstall lifecycle hook</mark> in the appspec.yml file."}, {"letter": "C", "html": "Create a CodeDeploy <mark>custom environment variable for each environment</mark>. Then place a script into the application revision that checks this environment variable to identify which deployment group the instance is part of. Use this information to configure the log level settings. Reference this script as part of the <mark>ValidateService lifecycle hook</mark> in the appspec.yml file."}, {"letter": "D", "html": "Create a script that uses the CodeDeploy environment variable <mark>DEPLOYMENT_GROUP_ID</mark> to identify which deployment group the instance is part of to configure the log level settings. Reference this script as part of the <mark>Install lifecycle hook</mark> in the appspec.yml file."}], "correct": ["B"]}, {"num": 4, "stemHtml": "A company requires its developers to tag all Amazon Elastic Block Store (Amazon EBS) volumes in an account to indicate a desired backup frequency. This requirement Includes EBS volumes that do not require backups. The company uses custom tags named Backup_Frequency that have values of none, dally, or weekly that correspond to the desired backup frequency. An audit finds that developers are occasionally not tagging the EBS volumes. A DevOps engineer needs to <mark>ensure that all EBS volumes always have the Backup_Frequency tag</mark> so that the company can <mark>perform backups at least weekly unless a different value is specified</mark>. Which solution will meet these requirements?", "choices": [{"letter": "A", "html": "Set up AWS Config in the account. Create a <mark>custom rule</mark> that returns a compliance failure for <mark>all Amazon EC2 resources</mark> that do not have a Backup Frequency tag applied. Configure a remediation action that uses a custom AWS Systems Manager Automation runbook to apply the Backup_Frequency tag with a value of weekly."}, {"letter": "B", "html": "Set up AWS Config in the account. Use a <mark>managed rule</mark> that returns a compliance failure for <mark>EC2::Volume resources</mark> that do not have a Backup Frequency tag applied. Configure a <mark>remediation action</mark> that uses a custom AWS Systems Manager Automation runbook to <mark>apply the Backup_Frequency tag with a value of weekly</mark>."}, {"letter": "C", "html": "Turn on AWS CloudTrail in the account. Create an Amazon EventBridge rule that reacts to EBS <mark>CreateVolume events</mark>. Configure a custom AWS Systems Manager Automation runbook to <mark>apply the Backup_Frequency tag</mark> with a value of weekly. Specify the runbook as the target of the rule."}, {"letter": "D", "html": "Turn on AWS CloudTrail in the account. Create an Amazon EventBridge rule that reacts to EBS <mark>CreateVolume events or EBS ModifyVolume events</mark>. Configure a custom AWS Systems Manager Automation runbook to apply the Backup_Frequency tag with a value of weekly. Specify the runbook as the target of the rule."}], "correct": ["B"]}, {"num": 5, "stemHtml": "A company is using an Amazon Aurora cluster as the data store for its application. The Aurora cluster is configured with a <mark>single DB instance</mark>. The application performs read and write operations on the database by using the cluster&#x27;s instance endpoint. The company has scheduled an update to be applied to the cluster during an upcoming maintenance window. The <mark>cluster must remain available with the least possible interruption</mark> during the maintenance window. What should a DevOps engineer do to meet these requirements?", "choices": [{"letter": "A", "html": "<mark>Add a reader instance</mark> to the Aurora cluster. Update the application to use the Aurora <mark>cluster endpoint for write operations</mark>. Update the Aurora cluster&#x27;s <mark>reader endpoint for reads</mark>."}, {"letter": "B", "html": "Add a reader instance to the Aurora cluster. Create a <mark>custom ANY endpoint</mark> for the cluster. Update the application to use the Aurora cluster&#x27;s custom ANY endpoint for <mark>read and write operations</mark>."}, {"letter": "C", "html": "Turn on the <mark>Multi-AZ option on the Aurora cluster</mark>. Update the application to use the Aurora cluster endpoint for write operations. Update the Aurora cluster\u2019s reader endpoint for reads."}, {"letter": "D", "html": "Turn on the <mark>Multi-AZ option</mark> on the Aurora cluster. Create a <mark>custom ANY endpoint</mark> for the cluster. Update the application to use the Aurora cluster&#x27;s custom ANY endpoint for read and write operations"}], "correct": ["A"]}];
const TOTAL = QUESTIONS.length;
let idx = 0;
let answered = false;

function render() {
  answered = false;
  const q = QUESTIONS[idx];
  document.getElementById('qCount').textContent = `Q ${idx+1}/${TOTAL} (#${q.num})`;
  document.getElementById('stemText').innerHTML = q.stemHtml;
  const badge = document.getElementById('badge');
  badge.className = 'badge'; badge.innerHTML = '';
  const wrap = document.getElementById('choicesWrap');
  wrap.innerHTML = '';
  q.choices.forEach(c => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.id = 'c_' + c.letter;
    div.innerHTML = `<span class="letter">${c.letter}.</span>${c.html}`;
    div.onclick = () => pick(c.letter, q);
    wrap.appendChild(div);
  });
}
function pick(letter, q) {
  if (answered) return;
  answered = true;
  const isCorrect = q.correct.includes(letter);
  document.querySelectorAll('.choice').forEach(el => {
    const l = el.id.replace('c_', '');
    if (q.correct.includes(l)) el.classList.add('correct');
    else if (l === letter) el.classList.add('wrong');
    else el.classList.add('dim');
  });
  const badge = document.getElementById('badge');
  badge.classList.add('show', isCorrect ? 'correct' : 'wrong');
  badge.innerHTML = isCorrect ? 'Correct!' : ('Answer: ' + q.correct.join(''));
}
function nextQ() { if (idx < TOTAL-1) { idx++; render(); } }
function prevQ() { if (idx > 0) { idx--; render(); } }
render();
</script>
</body>
</html>
